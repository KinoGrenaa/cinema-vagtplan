name: Release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hygiene:
    name: Repository and release tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node ./scripts/check-release-hygiene.mjs
      - run: npm run test:release-scripts
      - run: npm run check:backend-hardening
      - run: npm run check:frontend-hardening
      - run: npm run check:frontend-flows
      - run: npm run check:frontend-build-cache

  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run audit:report
      - run: npm run test:xlsx-hardening
      - run: npm test -- --runInBand
      - run: npm run test:release
      - run: npm run build

  backend-runtime:
    name: Backend runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          tags: cinema-vagtplan-backend:ci
          load: true
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime
      - name: Verify production-only runtime dependencies and Prisma Client
        run: >-
          docker run --rm --entrypoint node cinema-vagtplan-backend:ci -e
          "const fs=require('node:fs'); require('@prisma/client'); require('bcrypt');
          const archive=require('archiver')('zip');
          if(typeof archive.append!=='function'||typeof archive.finalize!=='function') throw new Error('Archiver-adapterens kontrakt er ugyldig');
          archive.abort();
          const forbidden=['jest','prisma','ts-node','typescript','@nestjs/cli'];
          const present=forbidden.filter((name)=>fs.existsSync('/app/node_modules/'+name));
          if(present.length) throw new Error('DevDependencies i runtime-image: '+present.join(', '));
          if(!fs.existsSync('/app/node_modules/.prisma/client')) throw new Error('Genereret Prisma Client mangler');
          console.log('Runtime-afhængigheder, Archiver-adapter og Prisma Client OK.');"

  frontend:
    name: Frontend tests, audit and runtime image
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx', 'frontend/**/*.css', 'shared/**/*.[jt]s', 'shared/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npm run audit:report
        working-directory: frontend
      - run: npm run test:dashboard
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend standalone runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          tags: cinema-vagtplan-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend-runtime
          cache-to: type=gha,mode=max,scope=frontend-runtime
      - name: Verify minimal non-root frontend runtime image
        run: >-
          docker run --rm --entrypoint node cinema-vagtplan-frontend:ci -e
          "const fs=require('node:fs');
          const roots=['/app/node_modules','/app/frontend/node_modules'];
          const forbidden=['typescript','eslint','tailwindcss','@types/node','@tailwindcss/postcss'];
          const present=forbidden.filter((name)=>roots.some((root)=>fs.existsSync(root+'/'+name)));
          if(present.length) throw new Error('DevDependencies i frontend runtime-image: '+present.join(', '));
          if(fs.existsSync('/app/frontend/app')) throw new Error('Frontend-kildekode findes i runtime-imaget');
          if(!['/app/frontend/server.js','/app/server.js'].some((path)=>fs.existsSync(path))) throw new Error('Standalone server.js mangler');
          if(process.getuid&&process.getuid()===0) throw new Error('Frontend runtime koerer som root');
          if(process.env.NODE_ENV!=='production') throw new Error('NODE_ENV er ikke production');
          console.log('Frontend standalone runtime-image OK.');"

  frontend-flows:
    name: Critical frontend flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build Playwright flow-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: flow-tests
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          tags: cinema-vagtplan-frontend-flow-tests:ci
          load: true
          cache-from: type=gha,scope=frontend-flow-tests
          cache-to: type=gha,mode=max,scope=frontend-flow-tests
      - name: Run critical browser flows
        run: >-
          docker run --rm --ipc=host
          cinema-vagtplan-frontend-flow-tests:ci
