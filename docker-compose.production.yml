name: cinema-vagtplan-production

x-node-service: &node-service
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  labels:
    com.kinogrenaa.cinema-vagtplan.revision: ${DEPLOY_REVISION:-unmanaged}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    labels:
      com.kinogrenaa.cinema-vagtplan.revision: ${DEPLOY_REVISION:-unmanaged}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  migrate:
    build:
      context: ./backend
      target: dependencies
    init: true
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.kinogrenaa.cinema-vagtplan.revision: ${DEPLOY_REVISION:-unmanaged}
    networks:
      - app

  backend:
    <<: *node-service
    build:
      context: ./backend
      target: runtime
    command: ["npm", "run", "start:container"]
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      FRONTEND_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.production}
      BACKEND_CORS_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.production}
      REALTIME_CORS_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.production}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    volumes:
      - production_backend_runtime:/app/runtime-dist
      - production_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/').then((response)=>{if(response.status>=500)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app

  frontend:
    <<: *node-service
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${APP_ORIGIN:?Set APP_ORIGIN in .env.production}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((response)=>{if(response.status<200||response.status>=400)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS in .env.production}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL in .env.production}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0:80}:80"
      - "${HTTPS_BIND:-0.0.0.0:443}:443"
      - "${HTTPS_UDP_BIND:-0.0.0.0:443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      com.kinogrenaa.cinema-vagtplan.revision: ${DEPLOY_REVISION:-unmanaged}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

networks:
  app:

volumes:
  production_postgres_data:
  production_backend_runtime:
  production_uploads:
  production_caddy_data:
  production_caddy_config:
