services:
  database:
    image: postgres:16
    container_name: cinema-vagtplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    container_name: cinema-vagtplan-backend
    restart: unless-stopped
    command: ["npm", "run", "start:container"]
    ports:
      - "3001:3001"
      - "5555:5555"
    env_file:
      - ./backend/.env
    depends_on:
      - database
    volumes:
      - ./backend:/app
      - backend_dist:/app/runtime-dist
      - /app/node_modules
  frontend:
    build:
      context: ./frontend
    container_name: cinema-vagtplan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - /app/node_modules

volumes:
  postgres_data:
  backend_dist:
