services:
  database:
    image: postgres:16
    container_name: cinema-vagtplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema123
      POSTGRES_DB: cinema_vagtplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: cinema-vagtplan-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_S47BkoqATKmp@ep-rapid-salad-altua8sr.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require
      JWT_SECRET: super-secret-key-change-later
    depends_on:
      - database
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: cinema-vagtplan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: