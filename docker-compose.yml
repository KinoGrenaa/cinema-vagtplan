services:
  database:
    image: postgres:16
    container_name: cinema-vagtplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: cinema-vagtplan-backend
    restart: unless-stopped
    command: ["npm", "run", "start:container"]
    ports:
      - "3001:3001"
      - "5555:5555"
    env_file:
      - ./backend/.env
    depends_on:
      - database
    volumes:
      - ./backend:/app
      - backend_dist:/app/runtime-dist
      - /app/node_modules
  backend-build:
    build:
      context: ./backend
      target: build
    profiles:
      - tools
    working_dir: /app
    command: ["node", "-e", "process.exit(0)"]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: cinema-vagtplan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend
  frontend-build:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: dependencies
    profiles:
      - tools
    working_dir: /app/frontend
    command: ["node", "-e", "process.exit(0)"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared:ro
      - /app/frontend/node_modules
  frontend-flow-tests:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: flow-tests
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    profiles:
      - tools
    init: true
    ipc: host
    volumes:
      - ./frontend/test-results:/tests/test-results
volumes:
  postgres_data:
  backend_dist:
